    #status {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      overflow-wrap: anywhere;
      white-space: pre-line;
      line-height: 1.6;

  </style>
</head>

<body>
  <h1>Estoque Industrial</h1>
  <p>Posicione o QR Code dentro da área de leitura.</p>

  <div id="reader"></div>
  <div id="status">Preparando câmera...</div>

  <script>
    const API_URL = "https://migration-program-slim-ken.trycloudflare.com/api/scan";
    const status = document.getElementById("status");

    let ultimoCodigo = "";
    let ultimoEnvio = 0;

    async function enviarCodigo(codigo) {
      const agora = Date.now();

      if (codigo === ultimoCodigo &&
          agora - ultimoEnvio < 3000) {
        return;
      }

      ultimoCodigo = codigo;
      ultimoEnvio = agora;

      status.textContent = "Consultando peça " + codigo + "...";

      try {
        const resposta = await fetch(API_URL, {
          method: "POST",
          mode: "cors",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            codigo: codigo
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso) {
          throw new Error(
            dados.mensagem || "Falha no envio."
          );
        }

        status.textContent =
          "PEÇA ENCONTRADA!\n\n" +
          "Código: " + (dados.codigo || "Não informado") + "\n" +
          "Nome: " + (dados.nome || "Não informado") + "\n" +
          "Localização: " + (dados.localizacao || "Não informada") + "\n" +
          "Quantidade: " + (dados.quantidade ?? "Não informada") + "\n" +
          "Estoque mínimo: " + (dados.estoque_minimo ?? "Não informado");

      } catch (erro) {
        status.textContent =
          "Erro no envio: " + erro.message;

        console.error("Detalhes do erro:", erro);
        ultimoCodigo = "";
      }
    }

    async function iniciarScanner() {
      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("Biblioteca QR Code não carregou.");
        }

        const scanner = new Html5Qrcode("reader");

        status.textContent = "Procurando câmeras...";

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("Nenhuma câmera encontrada.");
        }

        const camera =
          cameras.find(c =>
            /back|traseira|environment/i.test(c.label)
          ) || cameras[cameras.length - 1];

        status.textContent = "Iniciando câmera...";

        await scanner.start(
          camera.id,
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },
          codigo => enviarCodigo(codigo),
          () => {}
        );

        status.textContent =
          "Câmera iniciada! Aguardando QR Code...";

      } catch (erro) {
        status.textContent = "Erro na câmera: " + erro.message;
        console.error("Erro ao iniciar scanner:", erro);
      }
    }

    iniciarScanner();
  </script>
</body>
</html>
