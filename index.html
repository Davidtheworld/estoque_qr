

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque Industrial</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
      background: #f1f4f8;
      color: #172033;
    }

    h1 { text-align: center; }

    #reader {
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>Estoque Industrial</h1>
  <p>Posicione o QR Code dentro da área de leitura.</p>

  <div id="reader"></div>
  <div id="status">Preparando câmera...</div>

  <script>
    // Vamos configurar o endereço da API depois.
    const API_URL = "https://fuji-gardens-exports-medicaid.trycloudflare.com/api/scan";
    const status = document.getElementById("status");

    let ultimoCodigo = "";
    let ultimoEnvio = 0;

    async function enviarCodigo(codigo) {
      const agora = Date.now();

      if (codigo === ultimoCodigo &&
          agora - ultimoEnvio < 3000) {
        return;
      }

      ultimoCodigo = codigo;
      ultimoEnvio = agora;

      // Ainda não envia ao Node-RED.
      // Primeiro vamos testar somente a câmera.
     status.textContent = "Enviando " + codigo + "...";

try {
    const resposta = await fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            codigo: codigo
        })
    });

    const dados = await resposta.json();

    if (!resposta.ok || !dados.sucesso) {
        throw new Error(dados.mensagem || "Falha no envio.");
    }

    status.textContent =
        "Sucesso! Código recebido: " + dados.codigo;

} catch (erro) {
    status.textContent = "Erro no envio: " + erro.message;
    ultimoCodigo = "";
}

    async function iniciarScanner() {
      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("Biblioteca QR Code não carregou.");
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("Câmera indisponível neste navegador.");
        }

        const scanner = new Html5Qrcode("reader");

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("Nenhuma câmera encontrada.");
        }

        const camera =
          cameras.find(c =>
            /back|traseira|environment/i.test(c.label)
          ) || cameras[cameras.length - 1];

        status.textContent = "Iniciando câmera...";

        await scanner.start(
          camera.id,
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },
          codigo => enviarCodigo(codigo),
          () => {}
        );

        status.textContent = "Câmera iniciada! Aguardando QR Code...";
      } catch (erro) {
        status.textContent = "Erro: " + erro.message;
      }
    }

    iniciarScanner();
  </script>
</body>
</html>
